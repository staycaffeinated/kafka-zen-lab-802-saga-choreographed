pluginManagement {
    includeBuild("./gradle/settings")
}

plugins {
    id "buildlogic.repositories"

    // This plugin is related to:
    // https://docs.gradle.org/8.4/userguide/toolchains.html#sub:download_repositories
    id 'org.gradle.toolchains.foojay-resolver-convention' version '0.8.0'
}

rootProject.name = 'kafka-zen-lab-802-saga-choreographed'

include "order-service"
include "inventory-service"
include "shipping-service"
include "payment-service"
include "common-adapter-components"
include "common-application-components"
include "common-domain-components"
include "common-infra-components"
include "e2e-tests"

