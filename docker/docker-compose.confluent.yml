name: kafka-zen-lab-802-saga-choreo

networks:
  confluent_network:
    driver: bridge

volumes:
  broker-data: null

services:
# --- Inventory Service
  inventory-service:
    container_name: "choreo-inventory-service"
    platform: linux/arm64
    image: "kafka-zen-lab-802-choreo-inventory-service:1.0.0"
    ports:
      - "8086:8080"
    networks:
      - confluent_network
    depends_on:
      broker:
        condition: service_healthy
      postgres:
        condition: service_healthy
    environment:
      SPRING_KAFKA_BOOTSTRAP_SERVERS: broker:29092
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/postgres
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: postgres

  # --- Order Service
  order-service:
    container_name: "choreo-order-service"
    platform: linux/arm64
    image: "kafka-zen-lab-802-choreo-order-service:1.0.0"
    ports:
      - "8085:8080"
    networks:
      - confluent_network
    depends_on:
      broker:
        condition: service_healthy
      postgres:
        condition: service_healthy
    environment:
      SPRING_KAFKA_BOOTSTRAP_SERVERS: broker:29092
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/postgres
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: postgres

  # --- Payment Service
  payment-service:
    container_name: "choreo-payment-service"
    platform: linux/arm64
    image: "kafka-zen-lab-802-choreo-payment-service:1.0.0"
    ports:
      - "8087:8080"
    networks:
      - confluent_network
    depends_on:
      broker:
        condition: service_healthy
      postgres:
        condition: service_healthy
    environment:
      SPRING_KAFKA_BOOTSTRAP_SERVERS: broker:29092
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/postgres
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: postgres

  # --- Shipping Service
  shipping-service:
    container_name: "choreo-shipping-service"
    platform: linux/arm64
    image: "kafka-zen-lab-802-choreo-shipping-service:1.0.0"
    ports:
      - "8088:8080"
    networks:
      - confluent_network
    depends_on:
      broker:
        condition: service_healthy
      postgres:
        condition: service_healthy
    environment:
      SPRING_KAFKA_BOOTSTRAP_SERVERS: broker:29092
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/postgres
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: postgres


# --- Postgres
  postgres:
    image: postgres:${POSTGRES_VERSION:-18}
    container_name: postgres
    command: ["postgres", "-c", "wal_level=logical", "-c", "max_replication_slots=4", "-c", "max_wal_senders=4"]
    networks:
      - confluent_network
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: postgres
    volumes:
      - ./data/postgres:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

# --- Confluent Kafka broker (KRaft mode — no ZooKeeper)
  broker:
    image: confluentinc/cp-kafka:${CONFLUENT_VERSION:-8.2.2}
    hostname: broker
    container_name: broker
    networks:
      - confluent_network
    healthcheck:
      test: ["CMD", "kafka-broker-api-versions", "--bootstrap-server", "localhost:9092"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 30s
    ports:
      - "9092:9092"
      - "9101:9101"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: 'CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT'
      KAFKA_ADVERTISED_LISTENERS: 'PLAINTEXT://broker:29092,PLAINTEXT_HOST://localhost:9092'
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_JMX_PORT: 9101
      KAFKA_JMX_HOSTNAME: localhost
      KAFKA_PROCESS_ROLES: 'broker,controller'
      KAFKA_CONTROLLER_QUORUM_VOTERS: '1@broker:29093'
      KAFKA_LISTENERS: 'PLAINTEXT://broker:29092,CONTROLLER://broker:29093,PLAINTEXT_HOST://0.0.0.0:9092'
      KAFKA_INTER_BROKER_LISTENER_NAME: 'PLAINTEXT'
      KAFKA_CONTROLLER_LISTENER_NAMES: 'CONTROLLER'
      KAFKA_LOG_DIRS: '/var/lib/kafka/data'
      CLUSTER_ID: 'MkU3OEVBNTcwNTJENDM2Qk'
      KAFKA_DEFAULT_REPLICATION_FACTOR: 1
      KAFKA_NUM_PARTITIONS: 3
      KAFKA_LOG_RETENTION_MS: 300000
    volumes:
      - broker-data:/var/lib/kafka/data

# --- Confluent Schema Registry
  schema-registry:
    image: confluentinc/cp-schema-registry:${CONFLUENT_VERSION:-8.2.2}
    hostname: schema-registry
    container_name: schema-registry
    networks:
      - confluent_network
    depends_on:
      - broker
    ports:
      - "8081:8081"
    environment:
      SCHEMA_REGISTRY_HOST_NAME: schema-registry
      SCHEMA_REGISTRY_KAFKASTORE_BOOTSTRAP_SERVERS: 'broker:29092'
      SCHEMA_REGISTRY_LISTENERS: http://0.0.0.0:8081

# --- Kafka UI
  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: kafka-ui
    networks:
      - confluent_network
    depends_on:
      - broker
      - schema-registry
    ports:
      - "8080:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: confluent-local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: broker:29092
      KAFKA_CLUSTERS_0_SCHEMAREGISTRY: http://schema-registry:8081

# --- Confluent Kafka Connect

  connect:
    build:
      context: .
      dockerfile: Dockerfile.connect
    hostname: connect
    container_name: connect
    networks:
      - confluent_network
    depends_on:
      - broker
      - schema-registry
    ports:
      - "8083:8083"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://connect:8083/connectors"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 60s
    environment:
      CONNECT_BOOTSTRAP_SERVERS: 'broker:29092'
      CONNECT_REST_ADVERTISED_HOST_NAME: 'connect'
      CONNECT_GROUP_ID: compose-connect-group
      CONNECT_CONFIG_STORAGE_TOPIC: _connect-configs
      CONNECT_CONFIG_STORAGE_REPLICATION_FACTOR: 1
      CONNECT_OFFSET_FLUSH_INTERVAL_MS: 1000
      CONNECT_OFFSET_STORAGE_TOPIC: _connect-offsets
      CONNECT_OFFSET_STORAGE_REPLICATION_FACTOR: 1
      CONNECT_STATUS_STORAGE_TOPIC: _connect-status
      CONNECT_STATUS_STORAGE_REPLICATION_FACTOR: 1
      CONNECT_KEY_CONVERTER: org.apache.kafka.connect.converters.ByteArrayConverter
      CONNECT_VALUE_CONVERTER: org.apache.kafka.connect.converters.ByteArrayConverter
      CONNECT_PLUGIN_PATH: "/usr/share/java,/usr/share/confluent-hub-components"
      CONNECT_LOG4J_LOGGERS: org.apache.zookeeper=ERROR,org.I0Itec.zkclient=ERROR,org.reflections=ERROR

# --- Connector Registrar (auto-registers outbox connectors after Connect is healthy)

  connector-registrar:
    image: curlimages/curl:latest
    container_name: connector-registrar
    networks:
      - confluent_network
    depends_on:
      connect:
        condition: service_healthy
    volumes:
      - ./connectors:/connectors:ro
    command: >
      sh -c "
        for f in /connectors/*.json; do
          echo \"Registering $$f\";
          curl -sf -X POST -H 'Content-Type: application/json' --data @$$f http://connect:8083/connectors || exit 1;
        done
      "
    restart: on-failure


