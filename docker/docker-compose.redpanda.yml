name: kafka-zen-lab-802-saga-redpanda

networks:
  redpanda_network:
    driver: bridge

volumes:
  redpanda: null

services:
# --- Inventory service
  inventory-service:
    container_name: "choreo-inventory-service"
    platform: linux/arm64
    image: "kafka-zen-lab-802-choreo-inventory-service:1.0.0"
    ports:
      - "8086:8080"
    networks:
      - redpanda_network
    depends_on:
      redpanda:
        condition: service_healthy
      postgres:
        condition: service_healthy
      jaeger:
        condition: service_started
    environment:
      SPRING_KAFKA_BOOTSTRAP_SERVERS: redpanda:9092
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/postgres
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: postgres
      OTEL_EXPORTER_OTLP_ENDPOINT: http://jaeger:4318/v1/traces

# --- Order service
  order-service:
    container_name: "choreo-order-service"
    platform: linux/arm64
    image: "kafka-zen-lab-802-choreo-order-service:1.0.0"
    ports:
      - "8085:8080"
    networks:
      - redpanda_network
    depends_on:
      redpanda:
        condition: service_healthy
      postgres:
        condition: service_healthy
      jaeger:
        condition: service_started
    environment:
      SPRING_KAFKA_BOOTSTRAP_SERVERS: redpanda:9092
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/postgres
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: postgres
      OTEL_EXPORTER_OTLP_ENDPOINT: http://jaeger:4318/v1/traces

  # --- Payment service
  payment-service:
    container_name: "choreo-payment-service"
    platform: linux/arm64
    image: "kafka-zen-lab-802-choreo-payment-service:1.0.0"
    ports:
      - "8087:8080"
    networks:
      - redpanda_network
    depends_on:
      redpanda:
        condition: service_healthy
      postgres:
        condition: service_healthy
      jaeger:
        condition: service_started
    environment:
      SPRING_KAFKA_BOOTSTRAP_SERVERS: redpanda:9092
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/postgres
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: postgres
      OTEL_EXPORTER_OTLP_ENDPOINT: http://jaeger:4318/v1/traces

  # --- Shipping service
  shipping-service:
    container_name: "choreo-shipping-service"
    platform: linux/arm64
    image: "kafka-zen-lab-802-choreo-shipping-service:1.0.0"
    ports:
      - "8088:8080"
    networks:
      - redpanda_network
    depends_on:
      redpanda:
        condition: service_healthy
      postgres:
        condition: service_healthy
      jaeger:
        condition: service_started
    environment:
      SPRING_KAFKA_BOOTSTRAP_SERVERS: redpanda:9092
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/postgres
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: postgres
      OTEL_EXPORTER_OTLP_ENDPOINT: http://jaeger:4318/v1/traces

# --- Jaeger (distributed tracing — UI at http://localhost:16686)
  jaeger:
    image: jaegertracing/jaeger:2.21.0
    container_name: jaeger
    networks:
      - redpanda_network
    ports:
      - "4318:4318"   # OTLP HTTP receiver
      - "16686:16686" # Jaeger UI

# --- Postgres
  postgres:
    image: postgres:${POSTGRES_VERSION:-18}
    container_name: postgres
    command: ["postgres", "-c", "wal_level=logical", "-c", "max_replication_slots=4", "-c", "max_wal_senders=4"]
    networks:
      - redpanda_network
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: postgres
    volumes:
      - ./data/postgres:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

# --- Redpanda broker
  redpanda:
    command:
      - redpanda
      - start
      - --kafka-addr internal://0.0.0.0:9092,external://0.0.0.0:19092
      - --advertise-kafka-addr internal://redpanda:9092,external://localhost:19092
      - --pandaproxy-addr internal://0.0.0.0:8082,external://0.0.0.0:18082
      - --advertise-pandaproxy-addr internal://redpanda:8082,external://localhost:18082
      - --schema-registry-addr internal://0.0.0.0:8081,external://0.0.0.0:18081
      - --rpc-addr redpanda:33145
      - --advertise-rpc-addr redpanda:33145
      - --mode dev-container
      - --smp 1
      - --default-log-level=info
    image: docker.redpanda.com/redpandadata/redpanda:${REDPANDA_VERSION:-v26.2.1}
    container_name: redpanda
    volumes:
      - redpanda:/var/lib/redpanda/data
    networks:
      - redpanda_network
    ports:
      - 18081:18081
      - 18082:18082
      - 19092:19092
      - 19644:9644
    healthcheck:
      test: ["CMD-SHELL", "rpk cluster health | grep -qE 'Healthy:.*true'"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 30s

# --- Kafka Connect (cp-kafka-connect + Debezium PostgreSQL connector)
  connect:
    build:
      context: .
      dockerfile: Dockerfile.connect
    hostname: connect
    container_name: connect
    networks:
      - redpanda_network
    depends_on:
      - redpanda
    ports:
      - "8083:8083"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://connect:8083/connectors"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 60s
    environment:
      CONNECT_BOOTSTRAP_SERVERS: 'redpanda:9092'
      CONNECT_REST_ADVERTISED_HOST_NAME: 'connect'
      CONNECT_GROUP_ID: compose-connect-group
      CONNECT_CONFIG_STORAGE_TOPIC: _connect-configs
      CONNECT_CONFIG_STORAGE_REPLICATION_FACTOR: 1
      CONNECT_OFFSET_FLUSH_INTERVAL_MS: 1000
      CONNECT_OFFSET_STORAGE_TOPIC: _connect-offsets
      CONNECT_OFFSET_STORAGE_REPLICATION_FACTOR: 1
      CONNECT_STATUS_STORAGE_TOPIC: _connect-status
      CONNECT_STATUS_STORAGE_REPLICATION_FACTOR: 1
      CONNECT_KEY_CONVERTER: org.apache.kafka.connect.converters.ByteArrayConverter
      CONNECT_VALUE_CONVERTER: org.apache.kafka.connect.converters.ByteArrayConverter
      CONNECT_PLUGIN_PATH: "/usr/share/java,/usr/share/confluent-hub-components"
      CONNECT_LOG4J_LOGGERS: org.apache.zookeeper=ERROR,org.I0Itec.zkclient=ERROR,org.reflections=ERROR

# --- Connector Registrar (auto-registers outbox connectors after Connect is healthy)
  connector-registrar:
    image: curlimages/curl:latest
    container_name: connector-registrar
    networks:
      - redpanda_network
    depends_on:
      connect:
        condition: service_healthy
    volumes:
      - ./connectors:/connectors:ro
    command: >
      sh -c "
        for f in /connectors/*.json; do
          echo \"Registering $$f\";
          curl -sf -X POST -H 'Content-Type: application/json' --data @$$f http://connect:8083/connectors || exit 1;
        done
      "
    restart: on-failure

# --- Redpanda Console
  console:
    image: docker.redpanda.com/redpandadata/console:${REDPANDA_CONSOLE_VERSION:-v3.8.0}
    entrypoint: /bin/sh
    command: -c "echo \"$$CONSOLE_CONFIG_FILE\" > /tmp/config.yml; /app/console"
    environment:
      CONFIG_FILEPATH: /tmp/config.yml
      CONSOLE_CONFIG_FILE: |
        kafka:
          brokers: ["redpanda:9092"]
        schemaRegistry:
          enabled: true
          urls: ["http://redpanda:8081"]
        redpanda:
          adminApi:
            enabled: true
            urls: ["http://redpanda:9644"]
        kafkaConnect:
          enabled: true
          clusters:
            - name: local-connect-cluster
              url: http://connect:8083
    ports:
      - 8080:8080
    networks:
      - redpanda_network
    depends_on:
      - redpanda
      - connect
